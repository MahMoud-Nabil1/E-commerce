services:
  # ── Backend: Spring Boot ──────────────────────────────────────────────────
  - type: web
    name: ecommerce-backend
    runtime: docker
    rootDir: ecommerce
    plan: free
    envVars:
      - key: DB_Password
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://your-frontend.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # ── Frontend: React/Vite static site ─────────────────────────────────────
  - type: web
    name: ecommerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://ecommerce-backend.onrender.com
    routes:
      # Send all routes to index.html so React Router handles them client-side
      - type: rewrite
        source: /*
        destination: /index.html
